<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Fox Engineers</title>
    
    <link rel="stylesheet" href="https://use.typekit.net/uxn6vjk.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @font-face {
            font-family: "Aptos";
            src: url("/assets/fonts/Aptos.woff2") format("woff2");
            font-weight: 400;
            font-style: normal;
        }

        /* --- VARIABLES & RESET (Matched to index.html) --- */
        :root {
            --color-green:        #1a5c32;   
            --color-green-dark:   #0f3d20;   
            --color-yellow:       #f5c400;   
            --color-bg-main:      #f2f0eb;   
            --color-white:        #ffffff;
            --color-text-primary: #0f3d20;   
            --color-text-secondary: #3a5a45;   
            --tape-yellow:        #f5c400;
            --tape-black:         #1a1a1a;
            --tape-stripe-width:  28px;
            --transition:         all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Aptos", Arial, sans-serif;
        }

        body {
            background-color: var(--color-bg-main);
            color: var(--color-text-secondary);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3 {
            font-family: "acumin-pro", sans-serif;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        a { text-decoration: none; transition: var(--transition); }

        /* --- CAUTION TAPE --- */
        .caution-tape {
            width: 100%;
            height: 40px;
            background-image: repeating-linear-gradient(
                -45deg,
                var(--tape-yellow) 0px,
                var(--tape-yellow) var(--tape-stripe-width),
                var(--tape-black)  var(--tape-stripe-width),
                var(--tape-black)  calc(var(--tape-stripe-width) * 2)
            );
            flex-shrink: 0;
        }

        /* --- HEADER --- */
        header {
            background: var(--color-green);
            width: 100%;
            box-shadow: 0 4px 24px rgba(0,0,0,0.25);
        }
        .nav-inner {
            padding: 15px 0;
            text-align: center;
        }
        .nav-inner img { height: 34px; width: auto; }

        /* --- MAIN CONTENT --- */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .thank-you-card {
            background: var(--color-white);
            padding: 60px 50px;
            text-align: center;
            border-radius: 12px;
            border: 2px solid rgba(26, 92, 50, 0.12);
            box-shadow: 0 8px 32px rgba(26, 92, 50, 0.08);
            max-width: 600px;
            width: 100%;
            animation: slideUp 0.8s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
            opacity: 0;
            transform: translateY(40px);
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: var(--color-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            border: 3px solid rgba(26, 92, 50, 0.1);
            box-shadow: 0 10px 20px rgba(26, 92, 50, 0.15);
        }
        .icon-box i {
            font-size: 2.2rem;
            color: var(--color-yellow);
        }

        h1 {
            font-size: 2.6rem;
            color: var(--color-text-primary);
            margin-bottom: 15px;
            line-height: 1.1;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 35px;
        }

        /* --- BUTTON --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 36px;
            background-color: var(--color-yellow);
            color: var(--color-green-dark);
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            border: 2px solid var(--color-yellow);
            cursor: pointer;
            border-radius: 4px;
            gap: 10px;
            font-family: "acumin-pro", sans-serif;
            text-transform: uppercase;
        }
        .btn:hover {
            background-color: var(--color-green-dark);
            color: var(--color-yellow);
            border-color: var(--color-green-dark);
            transform: translateY(-3px);
        }

        /* --- FOOTER --- */
        footer {
            background: var(--tape-black);
            text-align: center;
            padding-bottom: 30px;
        }
        .footer-tape { margin-bottom: 30px; }
        .copyright {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.45);
        }
        
        @media (max-width: 768px) {
            .thank-you-card { padding: 40px 25px; }
            h1 { font-size: 2.2rem; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="caution-tape"></div>
        <div class="nav-inner">
            <a href="index.html">
                <img src="logo-white-final.png" alt="Fox Engineers Logo">
            </a>
        </div>
    </header>

    <main>
        <div class="thank-you-card">
            <div class="icon-box">
                <i class="fa-solid fa-check"></i>
            </div>
            <h1>Request Received</h1>
            <p>Thank you for getting in touch. Our engineering team has received your details and will be in contact with you shortly to discuss your requirements.</p>
            
            <a href="index.html" class="btn">
                <i class="fa-solid fa-arrow-left"></i> Return to Homepage
            </a>
        </div>
    </main>

    <footer>
        <div class="caution-tape footer-tape"></div>
        <div class="copyright">
            <p>© 2026 Fox Engineers Australia. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
